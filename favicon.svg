<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#favGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  
  <!-- Subtle Inner Container -->
  <rect x="7" y="7" width="50" height="50" rx="13" fill="#090d16" fill-opacity="0.82" />

  <!-- Code Brackets & Slash -->
  <!-- Left Bracket < -->
  <path d="M 23 22 L 15 32 L 23 42" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Slash / -->
  <path d="M 36 20 L 28 44" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />

  <!-- Right Bracket > -->
  <path d="M 41 22 L 49 32 L 41 42" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Terminal Top Accent Dot -->
  <circle cx="32" cy="12" r="1.5" fill="#38bdf8" />
</svg>
